<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันเกิดของมิโกะ 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-top: #dbeafe; --bg-bottom: #fce7f3; --window-bar: #fbcfe8;
            --text-dark: #4b5563; --input-bg: #fff5f8; --input-border: #f9a8d4;
            --btn-bg: #f472b6; --btn-hover: #db2777;
            --btn-gift-bg: #a7f3d0; --btn-gift-hover: #6ee7b7; --btn-gift-text: #166534;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mali', cursive; }
        body { background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%); background-attachment: fixed; min-height: 100vh; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(rgba(255, 255, 255, 0.45) 2px, transparent 2px); background-size: 30px 30px; z-index: 0; pointer-events: none; }
        
        #sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
        .sakura { position: absolute; background-color: #ffb7c5; border-radius: 100% 0% 100% 0%; opacity: 0.6; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); } 100% { transform: translateY(110vh) rotate(360deg); } }

        /* ตัวละครลอยข้าง */
        .side-deco { display: none; position: fixed; border-radius: 20px; border: 6px solid white; box-shadow: 0 15px 35px rgba(244, 114, 182, 0.2); z-index: 5; pointer-events: none; transition: opacity 0.5s ease-in-out; }
        @media (min-width: 1024px) { 
            .side-deco { display: block; width: 18vw; max-width: 220px; } 
            .left-deco { top: 50%; left: 5%; animation: floatLeft 6s ease-in-out infinite; } 
            .right-deco { top: 50%; right: 5%; animation: floatRight 7s ease-in-out infinite; } 
        }
        @keyframes floatLeft { 0%, 100% { transform: translateY(-50%) rotate(-6deg); } 50% { transform: translateY(-55%) rotate(-2deg); } }
        @keyframes floatRight { 0%, 100% { transform: translateY(-50%) rotate(6deg); } 50% { transform: translateY(-45%) rotate(2deg); } }

        .main-wrapper { display: flex; flex-direction: column; align-items: center; padding: 40px 0; position: relative; z-index: 10; width: 100%; }

        .center-logo { display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 300px; margin-bottom: 120px; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .center-logo:hover { transform: scale(1.03) rotate(-2deg); }
        .center-logo img { width: 100%; height: auto; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .channel-name { margin-top: 15px; background: white; padding: 8px 25px; border-radius: 50px; border: 3px solid #fbcfe8; color: #db2777; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .section { display: none; width: 90%; max-width: 450px; animation: fadeIn 0.5s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .wrapper { position: relative; width: 100%; }
        .top-character { position: absolute; bottom: calc(100% - 22px); left: 50%; transform: translateX(-50%); width: 150px; z-index: 12; pointer-events: none; }
        
        .window-box { background: white; border-radius: 15px; border: 3px solid var(--window-bar); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .window-header { background: var(--window-bar); height: 30px; display: flex; align-items: center; padding: 0 15px; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }

        .content { padding: 30px 25px; text-align: center; }
        h1 { color: #db2777; font-size: 1.5rem; margin-bottom: 15px; }
        .cover-img { width: 100%; max-width: 250px; border-radius: 20px; margin-bottom: 20px; }

        .action-btn { display: block; width: 100%; padding: 15px; border-radius: 50px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; margin-bottom: 12px; }
        .btn-pink { background: var(--btn-bg); color: white; box-shadow: 0 5px 15px rgba(244, 114, 182, 0.4); }
        .btn-green { background: var(--btn-gift-bg); color: var(--btn-gift-text); box-shadow: 0 5px 15px rgba(167, 243, 208, 0.4); }
        .action-btn:hover:not(:disabled) { transform: translateY(-3px); opacity: 0.9; }
        .action-btn:disabled { background: #ccc; cursor: not-allowed; }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 0.9rem; color: var(--text-dark); }
        input, textarea { width: 100%; padding: 12px; border: 2px solid var(--input-border); border-radius: 10px; background: var(--input-bg); font-size: 1rem; color: var(--text-dark); }
        
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        
        /* 💬 Speech Bubble 💬 */
        .speech-bubble {
            position: absolute; background: white; border: 2.5px solid #86efac; border-radius: 50px;
            padding: 10px 20px; color: #166534; font-weight: 700; font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 101; transform: rotate(5deg);
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -12px; left: 25px;
            border-width: 12px 12px 0 0; border-style: solid;
            border-color: #86efac transparent transparent transparent;
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 35px 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 4px solid var(--window-bar); }
        .modal-image { width: 100%; max-width: 200px; margin-top: 15px; border-radius: 12px; }
        .back-link { display: inline-block; margin-top: 10px; color: #991b1b; text-decoration: underline; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- 🔒 หน้าจอ Login (จะถูกซ่อนหลังจากล็อกอินสำเร็จ) -->
    <div id="loginOverlay">
        <img src="logo_01.png" style="width: 150px; border-radius: 20px; margin-bottom: 20px;" onerror="this.style.display='none'">
        <h2 style="color: #db2777;">ศาลเจ้า Kisane Miko</h2>
        <p style="color: #666; margin-bottom: 30px;">กรุณาล็อกอิน Gmail เพื่อเข้าสู่ระบบค่ะ 🐈</p>
        <div id="googleBtn"></div>
    </div>

    <div id="sakura-container"></div>
    
    <!-- ตัวละครลอยข้าง -->
    <img id="decoLeft" src="อร่อย.png" alt="Deco" class="side-deco left-deco" onerror="this.style.display='none'">
    <img id="decoRight" src="อารมณ์ดี.png" alt="Deco" class="side-deco right-deco" onerror="this.style.display='none'">

    <div class="main-wrapper" id="mainUI" style="display: none;">
        <a href="#" class="center-logo" onclick="openYouTubeApp(event)">
            <img src="logo_01.png" onerror="this.style.display='none'">
            <div class="channel-name"><span>Kisane Miko</span></div>
        </a>

        <!-- Section: Home -->
        <div id="homeSec" class="section active">
            <div class="wrapper">
                <img src="รูปมิโกะพื้นหลังใส.png" class="top-character" onerror="this.style.display='none'">
                <div class="window-box">
                    <div class="window-header"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
                    <div class="content">
                        <img src="HappyBirthday.png" class="cover-img" onerror="this.style.display='none'">
                        <h1>วันเกิดมิโกะ 2026 🐈💚</h1>
                        <p style="font-size: 0.8rem; color: #999; margin-bottom: 20px;">ล็อกอินโดย: <span id="userMail"></span></p>
                        <button class="action-btn btn-pink" onclick="go('wishSec')">เขียนคำอวยพร 💌</button>
                        <button class="action-btn btn-green" onclick="go('giftSec')">ส่งของขวัญ 🎁</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section: Wish -->
        <div id="wishSec" class="section">
            <div class="wrapper">
                <img src="รูปมิโกะพื้นหลังใส.png" class="top-character" onerror="this.style.display='none'">
                <div class="window-box">
                    <div class="window-header"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
                    <div class="content">
                        <h1>ส่งคำอวยพร 💌</h1>
                        <form id="wishForm">
                            <div class="form-group"><label>ชื่อใน Youtube</label><input type="text" id="wYT" required placeholder="ชื่อช่องของคุณ..."></div>
                            <div class="form-group"><label>คำอวยพร</label><textarea id="wMsg" rows="4" required placeholder="พิมพ์สิ่งดีๆ ให้น้องแมวเขียว..."></textarea></div>
                            <button type="submit" class="action-btn btn-pink" id="wBtn">ส่งคำอวยพรเลย!</button>
                        </form>
                        <span class="back-link" onclick="go('homeSec')">กลับหน้าหลัก</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section: Gift -->
        <div id="giftSec" class="section">
            <div class="wrapper">
                <img src="รูปมิโกะพื้นหลังใส.png" class="top-character" onerror="this.style.display='none'">
                <div class="window-box">
                    <div class="window-header"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
                    <div class="content">
                        <h1>ส่งของขวัญ 🎁</h1>
                        <form id="giftForm">
                            <div class="form-group"><label>ชื่อใน Youtube</label><input type="text" id="gYT" required></div>
                            <div class="form-group"><label>ชื่อผู้ส่งพัสดุ</label><input type="text" id="gName" required></div>
                            <div class="form-group"><label>รายละเอียด</label><textarea id="gDetail" rows="3" required></textarea></div>
                            <div class="form-group"><label>รูปของขวัญ (หลายรูป)</label><input type="file" id="gPics" multiple required accept="image/*"></div>
                            <div class="form-group"><label>หลักฐานการส่ง (หลายรูป)</label><input type="file" id="gProofs" multiple required accept="image/*"></div>
                            <button type="submit" class="action-btn btn-green" id="gBtn">แจ้งส่งของขวัญ!</button>
                        </form>
                        <span class="back-link" onclick="go('homeSec')">กลับหน้าหลัก</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 MODAL สำเร็จ (ไม่มี location.reload) 🌟 -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="speech-bubble" style="top: -20px; right: 5px;">
                ขอบคุณนะ!<br>ได้รับข้อมูลแล้ว!
            </div>
            <h2 style="color: #27c93f; margin-top: 20px;">ส่งสำเร็จแล้ว! ✨</h2>
            <img src="ของขวัญ.png" class="modal-image" onerror="this.style.display='none'">
            <div style="margin-top: 20px;">
                <button class="action-btn btn-pink" onclick="closeSuccess('homeSec')">ไปหน้าหลัก (ทำอย่างอื่นต่อ) 🐈</button>
                <button class="action-btn btn-green" onclick="closeSuccess()" style="background:#eee; color:#666;">ส่งข้อความเพิ่ม 🐾</button>
            </div>
        </div>
    </div>

    <script>
        // ⚙️ ตั้งค่า Client ID และ GAS URL ⚙️
        const CLIENT_ID = "506840275210-d97qjm02ls2g6mlksi327a7le53tidvo.apps.googleusercontent.com";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxNA2-sUavxI7c5aNBzzXYMEI2WGR5UOOIjh4WfBjuaGfGe6-IBDdXNbspn6QGvteDP/exec";
        
        let email = "";

        const decoConfig = {
            homeSec: { left: "อร่อย.png", right: "อารมณ์ดี.png" },
            wishSec: { left: "donate_miko_03.png", right: "โกรธ.png" },
            giftSec: { left: "donate_miko_02.png", right: "นอน.png" }
        };

        window.onload = () => {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: res => {
                    const p = JSON.parse(atob(res.credential.split('.')[1]));
                    email = p.email;
                    document.getElementById('userMail').innerText = email;
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainUI').style.display = 'flex';
                    initSakura();
                }
            });
            google.accounts.id.renderButton(document.getElementById("googleBtn"), { theme: "outline", size: "large", shape: "pill" });
        };

        function go(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (decoConfig[id]) {
                document.getElementById('decoLeft').src = decoConfig[id].left;
                document.getElementById('decoRight').src = decoConfig[id].right;
            }
            window.scrollTo(0,0);
        }

        function closeSuccess(targetId) {
            document.getElementById('successModal').style.display = 'none';
            if(targetId) go(targetId);
        }

        const toB64 = f => new Promise(res => {
            const r = new FileReader(); r.readAsDataURL(f);
            r.onload = () => res({ filename: f.name, mimeType: f.type, data: r.result.split(',')[1] });
        });

        // ส่งข้อมูล Wish
        document.getElementById('wishForm').onsubmit = async e => {
            e.preventDefault();
            const b = document.getElementById('wBtn'); b.disabled = true; b.innerText = "กำลังส่ง...";
            const d = { type: 'wish', email, youtubeName: document.getElementById('wYT').value, wishContent: document.getElementById('wMsg').value };
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) });
            document.getElementById('wishForm').reset();
            document.getElementById('successModal').style.display = 'flex';
            b.disabled = false; b.innerText = "ส่งคำอวยพรเลย!";
        };

        // ส่งข้อมูล Gift
        document.getElementById('giftForm').onsubmit = async e => {
            e.preventDefault();
            const b = document.getElementById('gBtn'); b.disabled = true; b.innerText = "กำลังอัปโหลด...";
            const d = {
                type: 'gift', email,
                youtubeName: document.getElementById('gYT').value,
                senderName: document.getElementById('gName').value,
                giftDetail: document.getElementById('gDetail').value,
                giftPics: await Promise.all([...document.getElementById('gPics').files].map(toB64)),
                proofPics: await Promise.all([...document.getElementById('gProofs').files].map(toB64))
            };
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) });
            document.getElementById('giftForm').reset();
            document.getElementById('successModal').style.display = 'flex';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            b.disabled = false; b.innerText = "แจ้งส่งของขวัญ!";
        };

        function initSakura() {
            const c = document.getElementById('sakura-container');
            for(let i=0; i<15; i++) {
                let s = document.createElement('div'); s.className = 'sakura';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.width = s.style.height = (Math.random() * 10 + 10) + 'px';
                s.style.animationDuration = (Math.random() * 5 + 5) + 's';
                c.appendChild(s);
            }
        }

        function openYouTubeApp(e) {
            e.preventDefault();
            window.open('https://www.youtube.com/@KisaneMikoCh', '_blank');
        }
    </script>
</body>
</html>
