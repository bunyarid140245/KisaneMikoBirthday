<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันเกิดของมิโกะ2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #dbeafe; /* ฟ้าอ่อน */
            --bg-bottom: #fce7f3; /* ชมพูอ่อน */
            --window-bar: #fbcfe8;
            --text-dark: #4b5563;
            --btn-bg: #f472b6;
            --btn-hover: #db2777;
            --btn-gift-bg: #a7f3d0; /* สีเขียวมิ้นต์ */
            --btn-gift-hover: #6ee7b7;
            --btn-gift-text: #166534;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mali', cursive;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- ซากุระร่วง --- */
        #sakura-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .sakura {
            position: absolute;
            background-color: #ffb7c5;
            border-radius: 100% 0% 100% 0%;
            opacity: 0.6;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(20px) rotate(360deg) scale(1); opacity: 0; }
        }

        /* --- กล่องเนื้อหาหลัก --- */
        .welcome-card {
            position: relative;
            z-index: 10;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(244, 114, 182, 0.2);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 4px solid var(--window-bar);
            animation: floatUp 0.8s ease-out;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* รูปหน้าปก (เค้กวันเกิด) */
        .cover-image {
            width: 100%;
            max-width: 280px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }
        .cover-image:hover {
            transform: scale(1.02) rotate(-2deg);
        }

        h1 {
            color: var(--btn-hover);
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: var(--text-dark);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* กลุ่มปุ่มกด */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ปุ่มกดไปหน้าฟอร์มอวยพร */
        .start-btn {
            display: inline-block;
            background-color: var(--btn-bg);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 6px 15px rgba(244, 114, 182, 0.4);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(219, 39, 119, 0.5);
        }

        .start-btn:active {
            transform: translateY(1px);
        }

        /* ลูกเล่นประกายวิ้งๆ บนปุ่มชมพู */
        .start-btn::after {
            content: "✨";
            position: absolute;
            right: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .start-btn:hover::after {
            opacity: 1;
        }

        /* ปุ่มกดไปหน้าส่งของขวัญ */
        .gift-btn {
            display: inline-block;
            background-color: var(--btn-gift-bg);
            color: var(--btn-gift-text);
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 6px 15px rgba(167, 243, 208, 0.5);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .gift-btn:hover {
            background-color: var(--btn-gift-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(110, 231, 183, 0.6);
            color: #064e3b;
        }

        .gift-btn:active {
            transform: translateY(1px);
        }

        /* ลูกเล่นกล่องของขวัญบนปุ่มเขียว */
        .gift-btn::after {
            content: "🎀";
            position: absolute;
            right: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .gift-btn:hover::after {
            opacity: 1;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.45) 2px, transparent 2px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        .side-deco {
            display: none; /* ซ่อนเป็นค่าเริ่มต้น */
            position: fixed;
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 15px 35px rgba(244, 114, 182, 0.2);
            z-index: 5;
            pointer-events: none; /* ไม่ให้รูปบังการคลิกเมาส์ */
        }
        /* แสดงรูปตกแต่งเมื่อหน้าจอกว้างกว่า 1024px (จอคอมพิวเตอร์/แท็บเล็ตแนวนอน) */
        @media (min-width: 1024px) {
            .side-deco {
                display: block;
                width: 20vw; /* ขนาดสัมพันธ์กับความกว้างจอ */
                max-width: 280px;
            }
            .left-deco {
                top: 50%;
                left: 5%;
                animation: floatLeft 6s ease-in-out infinite;
            }
            .right-deco {
                top: 50%;
                right: 5%;
                animation: floatRight 7s ease-in-out infinite;
            }
        }
        @keyframes floatLeft {
            0%, 100% { transform: translateY(-50%) rotate(-6deg); }
            50% { transform: translateY(-55%) rotate(-2deg); }
        }
        @keyframes floatRight {
            0%, 100% { transform: translateY(-50%) rotate(6deg); }
            50% { transform: translateY(-45%) rotate(2deg); }
        }


    </style>
</head>
<body>

    <!-- ซากุระร่วง -->
    <div id="sakura-container"></div>
    <script>
        const sakuraContainer = document.getElementById('sakura-container');
        for(let i=0; i<20; i++) {
            let sakura = document.createElement('div');
            sakura.className = 'sakura';
            sakura.style.left = Math.random() * 100 + 'vw';
            sakura.style.width = (Math.random() * 10 + 10) + 'px';
            sakura.style.height = (Math.random() * 10 + 10) + 'px';
            sakura.style.animationDuration = (Math.random() * 5 + 5) + 's';
            sakura.style.animationDelay = (Math.random() * 5) + 's';
            sakuraContainer.appendChild(sakura);
        }
    </script>

    <!-- การ์ดต้อนรับ -->
    <div class="welcome-card">
        <!-- ใช้รูป HappyBirthday.jpg เป็นรูปหลัก -->
        <img src="HappyBirthday.png" alt="มิโกะกับเค้กวันเกิด" class="cover-image">
        
        <h1>สุขสันวันเกิด <br>ให้มิโกะ 🐈💚</h1>
        <p>มาร่วมเขียนคำอวยพรน่ารักๆ <br>และส่งรอยยิ้มให้เจ้าแมวเขียวตัวนี้กันเถอะน้า~</p>
        
        <div class="button-group">
            <!-- ลิงก์ไปยังหน้าฟอร์มอวยพรที่เราทำไว้ -->
            <a href="miko-form.html" class="start-btn">เริ่มเขียนคำอวยพร 💌</a>
            
            <!-- ลิงก์ไปยังหน้าส่งของขวัญ (เปลี่ยน gift.html เป็นหน้าเว็บของคุณ) -->
            <a href="gift.html" class="gift-btn">ส่งของขวัญให้มิโกะ 🎁</a>
        </div>
    </div>

</body>

</html>
